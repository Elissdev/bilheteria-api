name: Keep-alive

# Mantém o serviço do Render "acordado": no plano free ele hiberna após ~15 min
# sem acesso. Um ping no /health a cada 10 minutos evita o cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar /health
        run: |
          curl -sS --retry 3 --retry-all-errors --retry-delay 5 -m 90 \
            -o /dev/null -w "status: %{http_code} em %{time_total}s\n" \
            https://bilheteria-api-uc0j.onrender.com/health
